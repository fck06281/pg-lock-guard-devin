name: PG Lock Guard
on:
  pull_request:
    paths: ['migrations/**']
  push:
    branches: [main]

jobs:
  verify-locks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sandbox
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Seed mock schema & run lock guard
        env:
          SANDBOX_DB_URL: postgres://postgres:test@localhost:5432/sandbox
        run: |
          psql "$SANDBOX_DB_URL" -c "CREATE TABLE IF NOT EXISTS merchants(id serial primary key); CREATE TABLE IF NOT EXISTS orders(id serial primary key, merchant_id int, status text);"
          chmod +x scripts/check_locks.sh
          for f in migrations/*.sql; do ./scripts/check_locks.sh "$f"; done
